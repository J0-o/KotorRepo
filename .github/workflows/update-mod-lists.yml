name: Update mod lists

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Fetch DeadlyScraper
        run: git clone --depth 1 https://github.com/J0-o/DeadlyScraper.git external/DeadlyScraper
      - run: dotnet test tests/ModListPuller.Tests/ModListPuller.Tests.csproj
      - run: dotnet run --project src/ModListPuller/ModListPuller.csproj
      - name: Commit changed lists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/k1.json data/k2.json
          git diff --cached --quiet || git commit -m "Update mod lists"
          git push
